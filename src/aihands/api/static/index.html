<!doctype html>
<meta charset="utf-8">
<title>aihands operator console</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 32px; max-width: 720px; }
  h1 { font-size: 16px; }
  .none { color: #666; }
  .card { border: 1px solid #ccc; border-left: 4px solid #c80; padding: 12px 14px;
          margin: 12px 0; }
  .why { color: #444; }
  .meta { color: #777; font-family: ui-monospace, monospace; font-size: 12px; }
  button { margin: 8px 6px 0 0; padding: 5px 10px; }
</style>

<h1>Operator console</h1>
<p class="none">
  Deliberately a mock. What is real is underneath it: the run pauses, the person works in
  the same live browser session the automation was using, and the automation resumes from
  where it stopped. This page is only the button that triggers that.
</p>

<div id="list">Loading…</div>

<script>
const api = (path, body) => fetch(path, body
  ? {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)}
  : undefined).then(r => r.json());

const act = async (runId, path, decision) => {
  await api(`/api/interventions/${runId}/${path}`, {decision, operator: 'operator'});
  render();
};

async function render() {
  const items = await api('/api/interventions');
  const list = document.getElementById('list');
  if (!items.length) { list.innerHTML = '<p class="none">Nothing is waiting on a human.</p>'; return; }
  list.innerHTML = '';
  for (const i of items) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<b>${i.code}</b> — ${i.state}
      <div class="why">${i.reason}</div>
      <div class="meta">${i.capability_id} · step ${i.step_id || '—'} · ${i.frame_url || ''}</div>`;
    const add = (label, path, decision) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = () => act(i.run_id, path, decision);
      card.appendChild(b);
    };
    if (i.state === 'PAUSED') {
      add('Take control', 'take', '');
    } else {
      add('Continue', 'resume', 'CONTINUE');
      add('Retry the step', 'resume', 'RETRY_STEP');
      add('I did it manually', 'resume', 'HUMAN_COMPLETED');
      add('Abort', 'resume', 'ABORT');
    }
    list.appendChild(card);
  }
}
render();
setInterval(render, 3000);
</script>
