{# Inner-frame pages. Table layout and inline styles on purpose: this is what
   the surviving generation of these tools looks like, and it is the reason
   selector-based automation struggles with them. #}
<html>
<head><title>{{ t.display_name }}</title></head>
<body bgcolor="#eef1f4" style="font-family: Verdana, Geneva, sans-serif; font-size: 12px; margin: 0;">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr><td bgcolor="#1d3557" style="padding: 8px 12px; color: #ffffff; font-weight: bold;">
    {{ t.display_name }} &nbsp;&middot;&nbsp; Servicing Desk
  </td></tr>
  <tr><td style="padding: 14px;">
    {% block content %}{% endblock %}
  </td></tr>
</table>
</body>
</html>
